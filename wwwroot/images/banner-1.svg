<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <style>
      .t { font-family: "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
      .s { font-family: "Segoe UI", Roboto, Arial, sans-serif; font-weight: 600; fill: #c7d2fe; letter-spacing: 6px; }
      .glow { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite; }
      .glow-2 { transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out infinite reverse; }
      @keyframes breathe { 0%, 100% { opacity: .30; transform: scale(1); } 50% { opacity: .65; transform: scale(1.08); } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="halo-1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".6"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <circle class="glow" cx="220" cy="120" r="320" fill="url(#halo-1)"/>
  <circle class="glow-2" cx="1400" cy="300" r="360" fill="url(#halo-2)"/>

  <g filter="url(#shadow)">
    <text class="t" x="800" y="128" text-anchor="middle" font-size="110" letter-spacing="14">TIÊN PHONG</text>
  </g>
  <rect x="745" y="150" width="110" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
